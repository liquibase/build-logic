name: 'Setup AWS Vault'
description: 'Assume the grouped vault role for one credential and export /vault/grouped/<group> (or only the listed keys) into the job environment. The role credentials stay inside the action.'
inputs:
  group:
    description: 'Grouped secret to read: /vault/grouped/<group>'
    required: true
  role-arn:
    description: 'Full ARN of the group role, normally the caller repo secret VAULT_GROUPED_<GROUP>_ROLE_ARN. Wins over aws-account-id and role.'
    required: false
    default: ''
  aws-account-id:
    description: 'Account that holds the vault, normally the org secret VAULT_AWS_ACCOUNT_ID. Needed when role-arn is empty.'
    required: false
    default: ''
  role:
    description: 'Role to assume when it is not vault-grouped-<group> (a later shard is vault-grouped-<group>-N). Ignored with role-arn.'
    required: false
    default: ''
  keys:
    description: 'Space- or newline-separated keys to export; empty exports the whole group. A filter, not an access boundary.'
    required: false
    default: ''
  aws-region:
    description: 'AWS region of the vault'
    required: false
    default: 'us-east-1'
runs:
  using: 'composite'
  steps:
    # Composite actions don't enforce required; an empty ARN secret would otherwise fail inside STS.
    - name: Check the role for ${{ inputs.group }}
      if: inputs.role-arn == '' && inputs.aws-account-id == ''
      shell: bash
      run: |
        echo "::error::setup-aws-vault needs role-arn or aws-account-id for ${{ inputs.group }}; is its VAULT_GROUPED_*_ROLE_ARN secret set?"
        exit 1

    # Credentials stay out of the job env. Not a boundary: a job with id-token: write can assume the role itself.
    - name: Configure AWS credentials for ${{ inputs.group }}
      id: creds
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn != '' && inputs.role-arn || format('arn:aws:iam::{0}:role/{1}', inputs.aws-account-id, inputs.role != '' && inputs.role || format('vault-grouped-{0}', inputs.group)) }}
        aws-region: ${{ inputs.aws-region }}
        output-credentials: true
        output-env-credentials: false

    - name: Get the ${{ inputs.group }} secret from vault
      if: inputs.keys == ''
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
      with:
        secret-ids: |
          ,/vault/grouped/${{ inputs.group }}
        parse-json-secrets: true

    # Subset read: names match the whole-group read (upper-cased, other characters to _), values are kept as stored.
    - name: Get ${{ inputs.keys }} from vault
      if: inputs.keys != ''
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        KEYS: ${{ inputs.keys }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
        # Git Bash on Windows would rewrite /vault/... into a Windows path.
        MSYS_NO_PATHCONV: '1'
      run: |
        set -euo pipefail
        vault_json="$(aws secretsmanager get-secret-value \
          --secret-id "/vault/grouped/${GROUP}" \
          --query SecretString --output text)"
        for key in ${KEYS}; do
          # -b stops jq.exe writing CRLF; the x sentinel keeps trailing newlines.
          # == null instead of // so a stored false is exported, not treated as missing.
          value="$(jq -jb --arg k "$key" 'if .[$k] == null then empty elif (.[$k] | type) == "string" then .[$k] else (.[$k] | tojson) end' <<< "$vault_json" && printf x)" \
            || { echo "::error::/vault/grouped/${GROUP} is not valid JSON"; exit 1; }
          value="${value%x}"
          if [ -z "$value" ]; then
            echo "::error::/vault/grouped/${GROUP} has no value for $key"
            exit 1
          fi
          # tr, not ${key^^}: macOS runners ship bash 3.2.
          name="$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9_' '_')"
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              # The runner unescapes %25 and %0D before matching a mask, so escape % first.
              line="${line//'%'/%25}"
              echo "::add-mask::${line//$'\r'/%0D}"
            fi
          done <<< "$value"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
        done
