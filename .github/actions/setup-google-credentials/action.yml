name: 'Setup Google Credentials'
description: 'Get Google credentials from vault and configure authentication'
inputs:
  aws-region:
    description: 'AWS region for vault access'
    required: false
    default: 'us-east-1'
  vault-secret-id:
    description: 'Secret holding GOOGLE_CREDENTIALS, read with the AWS credentials already in the job; the caller assumes vault-grouped-google-credentials first (TECHOPS-1108, TECHOPS-1299).'
    required: false
    default: '/vault/grouped/google-credentials'
runs:
  using: 'composite'
  steps:
    - name: Get Google credentials from vault
      id: vault-secrets-google-creds-no-json
      shell: bash
      run: |
        GOOGLE_CREDENTIALS=$(aws secretsmanager get-secret-value --secret-id "${{ inputs.vault-secret-id }}" --region "${{ inputs.aws-region }}" --query 'SecretString' --output text | jq -r '.GOOGLE_CREDENTIALS')
        # Mask before the value reaches $GITHUB_ENV: every later step prints its env, and a caller on
        # grouped secrets has not loaded this one through an action that masks it. Covers the whole
        # JSON, then the private key on its own, both as stored (\n escapes) and decoded (PEM lines).
        {
          printf '%s\n' "$GOOGLE_CREDENTIALS"
          jq -r '.private_key? // empty | (tojson | .[1:-1]), .' <<< "$GOOGLE_CREDENTIALS"
        } | while IFS= read -r line; do
          if [ -n "$line" ]; then
            # The runner unescapes %25 and %0D before matching a mask, so escape % first.
            line="${line//'%'/%25}"
            echo "::add-mask::${line//$'\r'/%0D}"
          fi
        done
        echo "GOOGLE_CREDENTIALS=$GOOGLE_CREDENTIALS" >> $GITHUB_ENV
    
    - name: configure auth
      id: auth
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      env:
        GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ env.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
      with:
        credentials_json: ${{ env.GOOGLE_CREDENTIALS }}