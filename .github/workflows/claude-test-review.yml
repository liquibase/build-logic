name: Claude Test Quality Review

on:
  workflow_call:
    inputs:
      model:
        description: 'Claude model to use for reviews (default: haiku, the latest Haiku)'
        required: false
        default: 'haiku'
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  # GitHub OIDC token. claude-code-action exchanges it for the Claude GitHub App token
  # and, through workload identity federation, for the Claude API token. [TECHOPS-1129]
  id-token: write
  actions: read
  checks: read
  statuses: read

jobs:
  claude-test-review:
    runs-on: ubuntu-latest
    # Prevent excessive API costs from runaway reviews
    # 10 minutes should be sufficient for automated test reviews
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Claude Test Quality Review
        id: claude-test-review
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          # Claude API auth through workload identity federation; the reasoning is on the
          # same inputs in claude.yml. Keep these IDs identical across the three Claude
          # workflows, and never set `anthropic_api_key` or load ANTHROPIC_API_KEY into
          # the job env, which would silently win over federation. [TECHOPS-1129]
          anthropic_organization_id: eead731b-3597-46ca-8e5f-75c5956bb781
          anthropic_federation_rule_id: fdrl_019Z4pCgENxpcyqV8Fm76RW4
          anthropic_service_account_id: svac_01AzJbNCHk8R4Na66HtSLxVS
          track_progress: true
          prompt: |
            You are a unit test quality reviewer. Your job is to evaluate whether new or
            modified tests actually add value, follow best practices, and will hold up
            over time as the codebase evolves.

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            REVIEW SCOPE: Only review test files changed in this PR.

            TURN EFFICIENCY (minimize API costs):
            - Turn 1: Run `gh pr diff` to get ALL changed test files at once. Identify
              which source files you need for context from the import statements in the diff.
            - Turn 2: Use Read to open ALL needed source files in parallel (batch multiple
              Read calls in a single response). Do NOT read files one-at-a-time.
            - Turn 3: Post ALL feedback. Use a single `gh pr comment` with your full review
              rather than multiple inline comments. Group findings by file.
            - You should complete most reviews in 3-4 turns. Only use additional turns for
              PRs with 5+ test files that require extra reads.

            FLAG THESE ISSUES:

            1. **Bogus/tautological tests** - Tests that pass regardless of implementation
               (e.g., asserting on hardcoded values, `expect(true).toBe(true)`, testing
               mocks instead of real code)

            2. **Ineffective assertions** - Tests that render a component or call a function
               but don't assert anything meaningful about the result

            3. **Over-mocking** - Tests that mock so much that they're only testing the mock
               setup, not actual behavior. If you remove the code under test and the test
               still passes, it's over-mocked.

            4. **Implementation coupling** - Tests that assert on internal state, private
               methods, or implementation details instead of observable behavior and public API

            5. **Brittle tests** - Tests that will break on harmless refactors (testing exact
               CSS classes, hardcoded DOM structure, snapshot overuse)

            6. **Missing error/edge cases** - When a test covers the happy path but ignores
               obvious error conditions, boundary values, or null/undefined handling

            7. **Async anti-patterns** - Missing await, missing act() wrappers, race
               conditions, tests that pass due to timing rather than correctness

            8. **Copy-paste duplication** - Test blocks that are nearly identical and should
               use parameterized tests (test.each) or shared helpers

            9. **Poor test naming** - Test descriptions that don't explain what behavior is
               being verified (e.g., "it works", "test 1", "should render")

            10. **Missing cleanup** - Tests that don't clean up side effects (timers,
                subscriptions, DOM mutations) which can leak into other tests

            CONVENTIONS:
            - This repo may use Jest + React Testing Library for frontend tests
            - Tests should focus on user behavior, not implementation
            - Prefer `screen` queries over container queries
            - Prefer `userEvent` over `fireEvent`
            - Check the repository's CLAUDE.md and any testing guidelines for repo-specific patterns

            OUTPUT:
            - Post ONE consolidated `gh pr comment` with all findings grouped by file
            - REQUIRED: Always start the PR comment with the title "## Test Quality Review"
            - Each finding should explain WHY it's a problem and suggest a concrete fix
            - Use markdown headers per file (e.g., `### path/to/test.spec.ts`) with
              line references (e.g., `L45-L60`) so authors can locate the code
            - If no issues found: post a brief `gh pr comment` saying "## Test Quality Review\n\nNo test quality issues found." so the PR author knows the review completed successfully
            - Maximum 10 findings per review to avoid overwhelming the author

            FORBIDDEN:
            - Do NOT flag style preferences or formatting
            - Do NOT flag tests that are genuinely well-written just to have something to say
            - Do NOT comment on non-test files
            - Focus on tests that would give false confidence or break unnecessarily

          # Denies `Read` under /proc and on the action's token directory; the reasoning
          # is on claude_args in claude.yml. [TECHOPS-1129]
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*),Read"
            --disallowedTools "Read(//proc/**),Read(/${{ runner.temp }}/claude-workload-identity/**)"
            --model ${{ inputs.model }}
