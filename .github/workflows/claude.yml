name: Claude Code

on:
  workflow_call:
    inputs:
      model:
        description: 'Claude model to use (default: claude-sonnet-4-6)'
        required: false
        default: 'claude-sonnet-4-6'
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  # GitHub OIDC token. claude-code-action exchanges it for the Claude GitHub App token
  # and, through workload identity federation, for the Claude API token. [TECHOPS-1129]
  id-token: write
  # Required for CI integration tools (mcp__github_ci__*)
  # These allow Claude to check workflow runs, job statuses, and test results
  # Reference: https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md#ci-integration
  actions: read
  checks: read
  statuses: read

jobs:
  claude:
    # Author pre-filter, here rather than in the callers. Three layers guard this job and
    # this `if:` is the weakest of them, not the security boundary:
    #
    #   1. This `if:`. GitHub evaluates it before a runner exists, so a rejected event
    #      means no runner and no OIDC token. Earliest and cheapest, but coarse:
    #      `author_association` MEMBER is any org member and COLLABORATOR includes read
    #      and triage.
    #   2. `claude-code-action`'s own actor check, which requires write or admin on the
    #      repo. Finer-grained and the standards-aligned control, so it stays. It runs
    #      before the action exchanges the OIDC token for a Claude API token, so a
    #      rejected actor never holds one.
    #   3. The credential itself. This job reads no vault secrets: the Claude API token
    #      is minted per run through workload identity federation and expires in
    #      minutes, where it used to be a long-lived key loaded with the whole of
    #      /vault/liquibase. [TECHOPS-1129]
    #
    # It lives here because callers cannot be trusted to add it. On 2026-09-08, 14 repos
    # called this workflow and only liquibase/liquibase carried the gate. Two of the
    # other 13 are public. Fixing the callers alone leaves the next one to reopen it.
    #
    # `author_association` hangs off a different object per event (comment, review,
    # issue), which is why the check is repeated per branch rather than hoisted out. On
    # `issues: assigned` that object is the issue, so the value read is the issue
    # author's association and not the assigner's: a member assigning an outsider's
    # `@claude` issue is skipped. Intentional, because the body Claude would then act on
    # is still attacker-authored.
    #
    # The first clause passes through any event that is not one of the four public entity
    # events, so the first caller to want a cron-triggered run is not silently skipped.
    # It also means this expression gates nothing on a fork-reachable trigger such as
    # `pull_request_target`; a caller adding one needs its own gate.
    #
    # Callers keep their own `@claude` mention check: that decides when Claude is wanted,
    # this decides who is allowed to ask. [TECHOPS-1269]
    if: |
      (github.event_name != 'issue_comment' &&
       github.event_name != 'pull_request_review_comment' &&
       github.event_name != 'pull_request_review' &&
       github.event_name != 'issues') ||
      (github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      ))
    runs-on: ubuntu-latest
    # Prevent excessive API costs from runaway conversations
    # 15 minutes should be sufficient for most interactive tasks
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          # Workload identity federation instead of a stored API key: the action exchanges
          # this job's GitHub OIDC token for a short-lived Claude API token. The federation
          # rule accepts only the three build-logic Claude workflows at refs/heads/main, and
          # only when the calling repo belongs to the liquibase or Datical org. These IDs
          # are not credentials. They are inlined because a reusable workflow resolves
          # `vars` and `secrets` against the caller, and callers span two orgs. Keep them
          # identical in claude.yml, claude-code-review.yml and claude-test-review.yml.
          # Do not add `anthropic_api_key` back, and do not load ANTHROPIC_API_KEY into
          # the job env: either one silently wins over federation. [TECHOPS-1129]
          anthropic_organization_id: eead731b-3597-46ca-8e5f-75c5956bb781
          anthropic_federation_rule_id: fdrl_019Z4pCgENxpcyqV8Fm76RW4
          anthropic_service_account_id: svac_01AzJbNCHk8R4Na66HtSLxVS
          # Enable CI tools by granting actions:read permission to Claude
          # This activates mcp__github_ci__* tools for checking workflow runs and test results
          # Reference: https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md#additional_permissions

          # Shows "Claude is working..." progress comments (similar to v0.x behavior)
          # Helps users understand Claude is processing their request
          # Reference: https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md#track_progress
          track_progress: true
          # The agent is denied `Read` under /proc, where the action's own process still
          # has the OIDC request token in its environment, and on the directory where the
          # action keeps the GitHub OIDC token and the cached Claude API token. Whoever
          # reads an identity token that has not been exchanged yet can exchange it until
          # it expires. A `Read` deny does not cover a path given to a Bash command, so
          # `gh pr comment --body-file` can still post a file from either place. runner.temp
          # starts with `/`, so the rule's path starts with `//`, which Claude Code reads as
          # absolute. [TECHOPS-1129]
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Edit,Replace,mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details"
            --disallowedTools "Read(//proc/**),Read(/${{ runner.temp }}/claude-workload-identity/**)"
            --model ${{ inputs.model }}

