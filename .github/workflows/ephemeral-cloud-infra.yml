# Terraform Action to lint and apply updated redirects
name: Ephemeral Cloud Infrastructure
on:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy the ephemeral cloud infrastructure"
        required: false
        type: boolean
      destroy:
        description: "Destroy the ephemeral cloud infrastructure"
        required: false
        type: boolean
      dynamodb:
        description: "Deploy or destroy the dynamodb infrastructure"
        required: false
        type: boolean
        default: false
      documentdb:
        description: "Deploy or destroy the documentdb infrastructure"
        required: false
        type: boolean
        default: false
      snowflake_oss:
        description: "Deploy or destroy the snowflake OSS infrastructure"
        required: false
        type: boolean
        default: false
      snowflake_pro:
        description: "Deploy or destroy the snowflake PRO infrastructure"
        required: false
        type: boolean
        default: false
      snowflake_th:
        description: "Deploy or destroy the snowflake Test Harness infrastructure"
        required: false
        type: boolean
        default: false
      snowflake_ext:
        description: "Deploy or destroy the snowflake Extension infrastructure"
        required: false
        type: boolean
        default: false
      aws_postgresql:
        description: "Deploy or destroy the aws_postgresql infrastructure"
        required: false
        type: boolean
        default: false
      aws_postgresql_iam:
        description: "Deploy or destroy the IAM-auth aws_postgresql infrastructure (TECHOPS-934)"
        required: false
        type: boolean
        default: false
      aws_postgresql_iam_demo:
        description: "Also trust the LiquibaseDeveloper SSO role on the IAM-auth Postgres connect role, so a human presenter can AssumeRole for Secure demos. No effect unless aws_postgresql_iam is also true."
        required: false
        type: boolean
        default: false
      aws_postgresql_iam_demo_expiry:
        description: "Unix epoch (seconds) stamped as the IAM-auth Postgres demo-expiry tag. Terraform-managed so an autodeploy re-apply cannot strip it. No effect unless aws_postgresql_iam_demo is true."
        required: false
        type: string
        default: ""
      aws_oracle:
        description: "Deploy or destroy the aws_oracle infrastructure"
        required: false
        type: boolean
        default: false
      aws_mariadb:
        description: "Deploy or destroy the aws_mariadb infrastructure"
        required: false
        type: boolean
        default: false
      aws_aurora_mysql:
        description: "Deploy or destroy the aws_aurora_mysql infrastructure"
        required: false
        type: boolean
        default: false
      aws_mssql:
        description: "Deploy or destroy the aws_mssql infrastructure"
        required: false
        type: boolean
        default: false
      aws_aurora_postgres:
        description: "Deploy or destroy the aws_aurora_postgres infrastructure"
        required: false
        type: boolean
        default: false
      aws_mysql:
        description: "Deploy or destroy the aws_mysql infrastructure"
        required: false
        type: boolean
        default: false
      aws_redshift:
        description: "Deploy or destroy the aws_redshift infrastructure"
        required: false
        type: boolean
        default: false
      stack_id:
        description: "The stack ID to destroy"
        required: false
        type: string
      state_run_id:
        description: "For a cross-run destroy (destroy in a different run than the deploy, e.g. a scheduled reaper): the github.run_id of the deploy run whose Terraform state (in S3, key test-automation-ephemeral/stack/<run_id>.tfstate) should be targeted. Defaults to the current run, preserving the usual same-run deploy+destroy behaviour."
        required: false
        type: string
        default: ""
    outputs:
      stack_id:
        description: "The stack ID of the ephemeral cloud infrastructure"
        value: ${{ jobs.ephemeral-cloud-infra.outputs.stack_id }}
      resources_id:
        description: "The resources ID of the ephemeral cloud infrastructure"
        value: ${{ jobs.ephemeral-cloud-infra.outputs.resources_id }}

permissions:
  contents: read
  id-token: write
  # TECHOPS-1019: actions: read is no longer needed — cross-run destroy now reads
  # state from S3 by key (state_run_id), not by downloading another run's artifact.

jobs:
  ephemeral-cloud-infra:
    # `inputs.action` was never declared under workflow_call.inputs, so it rendered empty
    # (actionlint flagged it). Dropping it is name-preserving — GitHub trimmed the leading
    # space, so the job already displayed as "Ephemeral Cloud Infrastructure" — which keeps
    # required status checks in every calling repo intact.
    name: Ephemeral Cloud Infrastructure
    runs-on: ubuntu-latest
    env:
      GH_RUN_ID: ${{ github.run_id }}
      GH_REPOSITORY: ${{ github.repository }}
    outputs:
      stack_id: ${{ steps.set_stack_id.outputs.stack_id }} # Used to reference the stack created in the ephemeral infra
      resources_id: ${{ steps.create_infra.outputs.resources_id }} # Used to reference the resources created in the ephemeral infra
    steps:
      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ env.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout liquibase-infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          repository: liquibase/liquibase-infrastructure
          token: ${{ steps.get-token.outputs.token }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.AWS_DEV_GITHUB_OIDC_ROLE_ARN_BUILD_LOGIC }}
          aws-region: us-east-1

      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@d0e2c81467c31a68af60db5b1f9f1f54f79cab96 # v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPACELIFT_API_KEY_ENDPOINT: ${{ env.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ env.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ env.SPACELIFT_API_KEY_SECRET }}

      - name: Terraform Init
        working-directory: test-automation-ephemeral/stack
        id: init
        env:
          STATE_BUCKET: liquibase-dev-test-automation-ephemeral-tfstate
          STATE_RUN_ID: ${{ inputs.state_run_id }}
        run: |
          # TECHOPS-1019: keep this config's state in S3, keyed per run, instead of
          # shipping terraform.tfstate between the deploy and destroy legs as an artifact.
          # A deploy cancelled before the upload used to leave the destroy leg with no
          # state; it then imported only spacelift_stack.stack and destroyed just that,
          # stranding the ephemeral IAM role (PowerUserAccess) + AWS integration with no
          # reaper to reclaim them. Durable state means destroy reads the FULL state and
          # tears down every resource.
          #
          # The backend is written here, not committed to the module, because this job
          # checks out liquibase-infrastructure@main: a committed backend would break
          # every ephemeral run in the window before this workflow change also landed.
          # The bucket is created in liquibase-infrastructure (dev-account s3.tf) and must
          # exist first (see merge order in the PR).
          #
          # key: per run, so a run's deploy and destroy share state; a cross-run destroy
          # (the demo reaper) passes state_run_id to target that run's state. No lock
          # table / use_lockfile: TF 1.5.7 predates S3-native locking, and each run owns a
          # unique key that is never written concurrently.
          cat > backend.tf <<'HCL'
          terraform {
            backend "s3" {}
          }
          HCL
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=test-automation-ephemeral/stack/${STATE_RUN_ID:-$GH_RUN_ID}.tfstate" \
            -backend-config="region=us-east-1"

      - name: Create ephemeral stack
        id: create_stack
        if: ${{ inputs.deploy }}
        working-directory: test-automation-ephemeral/stack
        run: |
          terraform apply -auto-approve -var "run_id=$GH_RUN_ID" -var "run_repo=$GH_REPOSITORY"
          echo "EPHEMERAL_STACK_ID=$(terraform output -raw ephemeral_stack_id)" >> $GITHUB_ENV
          echo "stack_id=$(terraform output -raw ephemeral_stack_id)" >> "$GITHUB_OUTPUT"

      - name: Set stack ID output
        id: set_stack_id
        if: ${{ inputs.deploy }}
        env:
          CREATE_STACK_ID: ${{ steps.create_stack.outputs.stack_id }}
        run: |
          echo "Ephemeral stack created with ID: $CREATE_STACK_ID"
          echo "stack_id=$CREATE_STACK_ID" >> "$GITHUB_OUTPUT"

      # TECHOPS-1019: the Terraform state artifact is gone — state now lives in S3
      # (see "Terraform Init"), so there is nothing to upload and no artifact for the
      # destroy leg to depend on.

      - name: Create ephemeral infra
        id: create_infra
        working-directory: test-automation-ephemeral/infra
        if: ${{ inputs.deploy }}
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ env.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ env.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ env.SPACELIFT_API_KEY_SECRET }}
          STACK_ID: ${{ steps.create_stack.outputs.stack_id }}
          INPUT_DYNAMODB: ${{ inputs.dynamodb }}
          INPUT_DOCUMENTDB: ${{ inputs.documentdb }}
          INPUT_SNOWFLAKE_OSS: ${{ inputs.snowflake_oss }}
          INPUT_SNOWFLAKE_PRO: ${{ inputs.snowflake_pro }}
          INPUT_SNOWFLAKE_TH: ${{ inputs.snowflake_th }}
          INPUT_SNOWFLAKE_EXT: ${{ inputs.snowflake_ext }}
          INPUT_AWS_POSTGRESQL: ${{ inputs.aws_postgresql }}
          INPUT_AWS_POSTGRESQL_IAM: ${{ inputs.aws_postgresql_iam }}
          INPUT_AWS_POSTGRESQL_IAM_DEMO: ${{ inputs.aws_postgresql_iam_demo }}
          INPUT_AWS_POSTGRESQL_IAM_DEMO_EXPIRY: ${{ inputs.aws_postgresql_iam_demo_expiry }}
          INPUT_AWS_ORACLE: ${{ inputs.aws_oracle }}
          INPUT_AWS_MARIADB: ${{ inputs.aws_mariadb }}
          INPUT_AWS_AURORA_MYSQL: ${{ inputs.aws_aurora_mysql }}
          INPUT_AWS_MSSQL: ${{ inputs.aws_mssql }}
          INPUT_AWS_AURORA_POSTGRES: ${{ inputs.aws_aurora_postgres }}
          INPUT_AWS_MYSQL: ${{ inputs.aws_mysql }}
          INPUT_AWS_REDSHIFT: ${{ inputs.aws_redshift }}
        run: |
          ID=$(echo "$STACK_ID" | cut -d '-' -f 5)
          echo "resources_id=$ID" >> "$GITHUB_OUTPUT"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_stack_id $ID
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_dynamodb "$INPUT_DYNAMODB"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_documentdb "$INPUT_DOCUMENTDB"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_snowflake_oss "$INPUT_SNOWFLAKE_OSS"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_snowflake_pro "$INPUT_SNOWFLAKE_PRO"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_snowflake_th "$INPUT_SNOWFLAKE_TH"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_snowflake_ext "$INPUT_SNOWFLAKE_EXT"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_postgresql "$INPUT_AWS_POSTGRESQL"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_postgresql_iam "$INPUT_AWS_POSTGRESQL_IAM"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_postgresql_iam_demo "$INPUT_AWS_POSTGRESQL_IAM_DEMO"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_postgresql_iam_demo_expiry "$INPUT_AWS_POSTGRESQL_IAM_DEMO_EXPIRY"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_oracle "$INPUT_AWS_ORACLE"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_mariadb "$INPUT_AWS_MARIADB"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_aurora_mysql "$INPUT_AWS_AURORA_MYSQL"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_mssql "$INPUT_AWS_MSSQL"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_aurora_postgres "$INPUT_AWS_AURORA_POSTGRES"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_mysql "$INPUT_AWS_MYSQL"
          spacectl stack environment setvar --id $EPHEMERAL_STACK_ID TF_VAR_create_aws_redshift "$INPUT_AWS_REDSHIFT"
          # Taint the LTHDB database resource to force recreation (ignore errors if resource doesn't exist)
          if [[ "$INPUT_SNOWFLAKE_PRO" == "true" || "$INPUT_SNOWFLAKE_TH" == "true" ]]; then
            echo "Tainting LTHDB database resource to ensure clean state..."
            spacectl stack task --id $EPHEMERAL_STACK_ID --command "terraform taint 'snowflake_database.LIQUIBASETH_ORIGINAL[0]'" || echo "Resource doesn't exist or already tainted, continuing..."
          fi
          spacectl stack deploy --id $EPHEMERAL_STACK_ID --auto-confirm

      # TECHOPS-1019: destroy-only preflight. The RDS destroy below targets
      # inputs.stack_id (via Spacelift), while "Destroy ephemeral stack" targets whatever
      # the S3 state selected in "Terraform Init" (keyed by state_run_id) holds. Confirm
      # they are the SAME stack before destroying anything, and distinguish the two
      # empty-state cases so a missing state is never a silent no-op:
      #   * empty state + NO stack_id (same-run destroy) -> a deploy cancelled before apply
      #     provisioned nothing; skip both destroys so it raises no false teardown alert;
      #   * empty state + stack_id set (a targeted destroy, e.g. the scheduled reaper) ->
      #     the state SHOULD exist, so an empty one is an anomaly (wrong/legacy state_run_id,
      #     or a deploy whose state predates the S3 backend); fail rather than green-skip a
      #     real orphan;
      #   * present but != inputs.stack_id -> mismatched stack_id/state_run_id; fail rather
      #     than tear down the wrong stack.
      - name: Verify destroy target
        id: verify_state
        if: ${{ inputs.destroy }}
        working-directory: test-automation-ephemeral/stack
        env:
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          # Presence is read from `terraform state list`, not `terraform output`: a deploy
          # cancelled mid-apply can persist resources (the Spacelift stack, the ephemeral
          # IAM role) before Terraform writes the root outputs, so `terraform output` would
          # read empty and we would skip teardown and strand them; state list still sees them.
          RESOURCES="$(terraform state list 2>/dev/null || true)"
          STATE_STACK="$(terraform output -raw ephemeral_stack_id 2>/dev/null || true)"
          if [ -z "${RESOURCES}" ]; then
            if [ -n "${STACK_ID}" ]; then
              # A targeted destroy (stack_id set, e.g. the scheduled reaper that only ever
              # passes a stack whose RDS it just listed) expects the state to exist. An empty
              # one is an anomaly (wrong/legacy state_run_id, or a deploy whose state predates
              # the S3 backend and shipped as an artifact), not a cancelled-before-apply
              # deploy. Fail loudly rather than green-skip a real orphan.
              echo "::error::stack_id '${STACK_ID}' was requested but the selected Terraform state has no resources. This is an anomaly (missing or legacy state_run_id, or pre-S3 artifact state), not a cancelled-before-apply deploy. Refusing to no-op so a real orphan is not left un-reaped."
              exit 1
            fi
            echo "::warning::Selected state has no resources — nothing was provisioned (deploy likely cancelled before apply). Skipping teardown."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${STACK_ID}" ] && [ -n "${STATE_STACK}" ] && [ "${STATE_STACK}" != "${STACK_ID}" ]; then
            echo "::error::Selected state targets stack '${STATE_STACK}' but the stack_id input is '${STACK_ID}'. Refusing to destroy, to avoid tearing down the wrong stack (mismatched stack_id/state_run_id)."
            exit 1
          fi
          echo "Destroy target confirmed: $(printf '%s\n' "${RESOURCES}" | grep -c . | tr -d ' ') resource(s) in state, stack '${STATE_STACK:-<output not yet written>}'."
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Destroy ephemeral infra
        id: destroy_infra
        env:
          STACK_ID: ${{ inputs.stack_id }}
          TF_VAR_stack_id: ${{ inputs.stack_id }}
          SPACELIFT_API_KEY_ENDPOINT: ${{ env.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ env.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ env.SPACELIFT_API_KEY_SECRET }}
        # Skipped when the preflight found no provisioned stack (empty state), so a
        # cancelled-before-creation run is a clean no-op rather than a failed destroy.
        if: ${{ inputs.destroy && steps.verify_state.outputs.present == 'true' }}
        working-directory: test-automation-ephemeral/infra
        run: |
          # Retry the infra destroy to absorb transient AWS API throttling and
          # SG dependency-ordering races (a security group can't be deleted
          # until the RDS instance referencing it is fully gone). We intentionally
          # do NOT swallow a final failure (no `|| true`, no continue-on-error):
          # if the AWS resources are not actually destroyed we must let this step
          # fail so the Spacelift stack is kept and its state survives for a
          # retry. Deleting the stack after a failed destroy is what strands the
          # surviving RDS instances as untracked orphans (TECHOPS-523).
          attempts=3
          # Cap each attempt so a hung `spacectl stack task --tail` (a stalled
          # log stream) can't burn the whole job without ever retrying. 30m is
          # well above a normal RDS teardown, so it only trips on a real hang.
          attempt_timeout=30m
          for i in $(seq 1 "$attempts"); do
            echo "::group::terraform destroy attempt $i/$attempts"
            if timeout "$attempt_timeout" spacectl stack task --id "${STACK_ID}" --tail "terraform destroy -refresh=false -parallelism=10 -auto-approve"; then
              echo "::endgroup::"
              echo "Ephemeral infra destroyed successfully on attempt $i"
              exit 0
            fi
            echo "::endgroup::"
            # Skip the wait after the final attempt: we're about to fail anyway.
            if [ "$i" -lt "$attempts" ]; then
              backoff=$((30 * i))
              echo "::warning::terraform destroy attempt $i/$attempts failed; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::terraform destroy failed after $attempts attempts. Keeping Spacelift stack '${STACK_ID}' so its Terraform state is preserved for a retry. Investigate before the stack is removed to avoid orphaned RDS resources."
          exit 1

      # TECHOPS-1019: no artifact download. "Terraform Init" above already pointed this
      # config at its S3 state (keyed by state_run_id for a cross-run reaper destroy,
      # else this run), so "Destroy ephemeral stack" reads the full state directly —
      # both the same-run and cross-run download steps are gone, along with the
      # actions: read requirement the cross-run one imposed.

      - name: Destroy ephemeral stack
        # Only delete the Spacelift stack object when the AWS resource destroy
        # actually succeeded. If the infra destroy failed we keep the stack (and
        # its Terraform state) so the destroy can be retried; deleting it here
        # would strand the surviving RDS resources as orphans (TECHOPS-523).
        if: ${{ inputs.destroy && steps.destroy_infra.outcome == 'success' }}
        working-directory: test-automation-ephemeral/stack
        env:
          STATE_RUN_ID: ${{ inputs.state_run_id }}
        run: |
          # On a cross-run destroy the restored state belongs to state_run_id, so
          # pass that run id (not the reaper's) to keep the run_id var in sync with
          # the state being destroyed. Falls back to the current run for same-run.
          terraform destroy -auto-approve -var "run_id=${STATE_RUN_ID:-$GH_RUN_ID}" -var "run_repo=$GH_REPOSITORY"

      - name: Notify Slack on teardown failure
        # Alert on ANY teardown failure in the destroy leg, not just the infra
        # (RDS) destroy (TECHOPS-1019). The stack destroy — which removes the
        # ephemeral IAM role (PowerUserAccess) + AWS integration — can also fail
        # (e.g. a Spacelift/S3-state error), and that must be announced too, or an
        # admin-grade role is left live with nothing to reclaim it. State is kept
        # for a retry either way, so the alert covers orphaned RDS (TECHOPS-523)
        # and orphaned stack/role alike.
        if: ${{ inputs.destroy && failure() }}
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ env.EPHEMERAL_DANGLING_RESOURCES_SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: "Ephemeral teardown failed — possible orphaned resources"
          SLACK_MESSAGE: |
            Ephemeral teardown failed for stack `${{ inputs.stack_id }}` (${{ github.repository }}).
            State is preserved for a retry — please investigate and clean up to avoid orphaned resources: publicly-accessible RDS (TECHOPS-523) and/or the ephemeral IAM role + Spacelift stack (TECHOPS-1019).
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
