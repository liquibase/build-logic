name: FIPS VM test

# Checks the fips-vm action end to end with the published image: the VM boots in FIPS mode, a UBI 9 container
# inherits it, docker compose and Testcontainers start PostgreSQL, Liquibase installed from its RPM repo updates
# PostgreSQL with a FIPS-mode JVM, and files and GITHUB_ENV round-trip to the runner. Changes to fips/provision.sh are checked by fips-vm-image.yml, which builds the VM from scratch, and
# the laptop setup by fips-vm-laptop-test.yml.

on:
  pull_request:
    paths:
      - ".github/actions/fips-vm/**"
      - ".github/workflows/fips-vm-*.yml"
      - "fips/**"
  workflow_dispatch:
    inputs:
      image:
        description: "FIPS VM image to test. Empty builds the VM from the AlmaLinux 9 cloud image."
        required: false
        default: "ghcr.io/liquibase/fips-vm:alma9"

permissions:
  contents: read

concurrency:
  group: fips-vm-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fips-vm:
    # Blacksmith runners work too (checked 2026-10-26); the self-test runs on GitHub-hosted runners only.
    name: FIPS VM on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: fips-run {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start the FIPS VM
        id: fips
        uses: ./.github/actions/fips-vm
        with:
          image: ${{ inputs.image || 'ghcr.io/liquibase/fips-vm:alma9' }}

      - name: The kernel is in FIPS mode
        run: |
          sudo fips-mode-setup --check
          test "$(cat /proc/sys/crypto/fips_enabled)" = 1

      - name: A UBI 9 container inherits FIPS mode
        run: |
          test "$(docker run --rm registry.access.redhat.com/ubi9/ubi-minimal cat /proc/sys/crypto/fips_enabled)" = 1

      - name: Red Hat OpenJDK runs in FIPS mode, and -Dcom.redhat.fips=false turns it off
        run: |
          java -XshowSettings:security:providers -version > providers-on.txt 2>&1
          java -Dcom.redhat.fips=false -XshowSettings:security:providers -version > providers-off.txt 2>&1
          on=$(awk '/Provider name:/ {print $3; exit}' providers-on.txt)
          off=$(awk '/Provider name:/ {print $3; exit}' providers-off.txt)
          echo "First security provider: $on by default, $off with -Dcom.redhat.fips=false"
          test "$on" = SunPKCS11-NSS-FIPS
          test "$off" != SunPKCS11-NSS-FIPS

      - name: docker compose starts PostgreSQL
        run: |
          docker compose -f fips/selftest/compose.yml up -d --wait
          docker compose -f fips/selftest/compose.yml exec -T postgres psql -U postgres -tAc 'select 1'

      # The same steps as "Run Liquibase in the VM" in the developer guide. Liquibase OSS needs no license, so this
      # public repo can run it on every PR. Liquibase 5 doesn't bundle JDBC drivers.
      - name: Install Liquibase from its RPM repo
        run: |
          [ -f /etc/yum.repos.d/repo-liquibase-com.repo ] ||
            sudo dnf config-manager --add-repo https://repo.liquibase.com/repo-liquibase-com.repo
          sudo dnf install -y -q liquibase
          curl -fsSL -o "$RUNNER_TEMP/postgresql.jar" https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.14/postgresql-42.7.14.jar
          liquibase --version | grep -E 'Liquibase Version|Java Home'

      - name: Liquibase updates PostgreSQL with a FIPS-mode JVM
        working-directory: fips/selftest/liquibase
        env:
          LIQUIBASE_COMMAND_URL: jdbc:postgresql://localhost:5432/postgres
          LIQUIBASE_COMMAND_USERNAME: postgres
          LIQUIBASE_COMMAND_PASSWORD: fips-vm-selftest-password
          LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.yaml
        run: |
          liquibase --classpath="$RUNNER_TEMP/postgresql.jar" update
          liquibase --classpath="$RUNNER_TEMP/postgresql.jar" validate
          liquibase --classpath="$RUNNER_TEMP/postgresql.jar" rollback-count --count=1
          liquibase --classpath="$RUNNER_TEMP/postgresql.jar" update
          docker exec "$(docker ps -qf name=postgres)" psql -U postgres -tAc 'select note from fips_check' |
            grep -qx 'written by Liquibase in the FIPS VM'
          {
            echo "### Liquibase in the FIPS VM"
            echo
            echo '| Changeset | Checksum |'
            echo '| --- | --- |'
            docker exec "$(docker ps -qf name=postgres)" psql -U postgres -tAc \
              "select '| ' || id || ' | ' || md5sum || ' |' from databasechangelog order by orderexecuted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f fips/selftest/compose.yml down

      - name: Testcontainers starts PostgreSQL and a FIPS-mode JVM connects
        env:
          MAVEN_OPTS: -Dcom.redhat.fips=false
        run: mvn -B -ntp -f fips/selftest/pom.xml verify

      - name: Maven itself in FIPS mode (informational)
        continue-on-error: true
        run: mvn -B -ntp -q -f fips/selftest/pom.xml -Dmaven.repo.local=/tmp/m2-fips -DskipTests verify

      - name: Write a file and an env var from the VM
        run: |
          echo "written in the VM" > fips-vm-roundtrip.txt
          echo "FIPS_ROUNDTRIP=yes" >> "$GITHUB_ENV"

      - name: The runner sees them
        shell: bash
        run: |
          test "$(cat fips-vm-roundtrip.txt)" = "written in the VM"
          test "$FIPS_ROUNDTRIP" = yes
          echo "VM image: ${{ steps.fips.outputs.image }}"
