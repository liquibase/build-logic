# This workflow is invoked by individual Datical repositories to generate and upload the 3rd-party license report using FOSSA to Cloudflare R2. It is triggered by the central workflow located at:
# build-logic/.github/workflows/trigger-enterprise-fossa-third-party-license-report.yml
# The workflow generates a CSV report of 3rd-party licenses and uploads it to R2 and as an artifact for the team to view under `raw_reports`.
# TECHOPS-1320: R2 bucket is liquibase-org-assets, same enterprise_fossa_report/ key prefix as before.

name: Generate and upload 3rd Party License Fossa Report to R2

on:
  workflow_call:
    inputs:
      version_number_for_3p_fossa_report_generation:
        type: string
        required: true

jobs:
  fossa-scan:
    runs-on: ubuntu-latest
    env:
      VERSION_NUMBER: ${{ inputs.version_number_for_3p_fossa_report_generation }}
    permissions:
      contents: read
      packages: write
      id-token: write # Required for OIDC to assume the role
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Get the commit sha
        id: get_commit_sha
        run: |
          commit_sha=`(git rev-parse HEAD)`
          echo "commit_sha=${commit_sha}" >> $GITHUB_OUTPUT

      - name: Get repository name
        id: get_repo_name
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Setup Fossa CLI
        env:
          FOSSA_API_KEY: ${{ env.FOSSA_API_KEY }}
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          export FOSSA_API_KEY="${{ env.FOSSA_API_KEY }}"

      - name: Analyze project
        env:
          FOSSA_API_KEY: ${{ env.FOSSA_API_KEY }}
        run: fossa analyze --static-only-analysis

      - name: Generate JSON report
        env:
          FOSSA_API_KEY: ${{ env.FOSSA_API_KEY }}
        run: |
          # Run JSON report
          fossa report attribution --format json > fossa.json
          
          csv_filename="${{ steps.get_repo_name.outputs.repo_name }}.csv"
          
          # Extract fields from the JSON and create a CSV report.
          echo "Title,Version,Declared License,Package Homepage" > $csv_filename
          
          jq -r '
          (.directDependencies + .deepDependencies)[] |
          [
            .title,
            .version,
            (.licenses | map(.name) | join(";")),
            .projectUrl
          ] |
          @csv
          ' fossa.json >> $csv_filename

      - name: Configure AWS credentials for devops vault access
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.DEVOPS_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load Cloudflare R2 credentials from devops vault
        # Pulls only the keys this job needs from /vault/devops and masks them
        # (least privilege), rather than bulk-importing the vault.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/devops --region us-east-1 --query SecretString --output text)
          for k in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do
            # jq -j + sentinel: command substitution strips trailing newlines, which
            # would otherwise silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/devops"; exit 1; fi
            # Escape % before \r/\n: the runner unescapes %0D/%0A/%25 in mask text,
            # so escaping out of order means the mask never matches the secret.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON
          echo "Loaded CLOUDFLARE_ACCOUNT_ID and R2 access/secret keys from /vault/devops."

      - name: Upload 3rd Party report to R2
        if: always()
        env:
          R2_AKID: ${{ env.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ env.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          CSV_FILENAME: ${{ steps.get_repo_name.outputs.repo_name }}.csv
        run: |
          # VERSION_NUMBER is read as a plain shell variable, not interpolated as an
          # expression, and validated before use in the object key (script injection).
          # Deliberately not written as the expression here: GitHub interpolates
          # expressions anywhere in a run block, including comments.
          if ! [[ "$VERSION_NUMBER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::VERSION_NUMBER '$VERSION_NUMBER' contains unexpected characters"
            exit 1
          fi
          # R2 rejects a request carrying a session token; OIDC creds export one, so
          # drop it (and its legacy alias) before every R2 S3-API call.
          unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          # CRC32: newer aws-cli defaults to a CRC64NVME checksum, which R2 rejects.
          AWS_ACCESS_KEY_ID="$R2_AKID" AWS_SECRET_ACCESS_KEY="$R2_SECRET" \
            aws s3 cp "$CSV_FILENAME" "s3://liquibase-org-assets/enterprise_fossa_report/${VERSION_NUMBER}/raw_reports/" --checksum-algorithm CRC32 --endpoint-url "$R2_ENDPOINT"

      - name: Set CSV filename
        id: set_csv_filename
        run: echo "csv_filename=${{ steps.get_repo_name.outputs.repo_name }}.csv" >> $GITHUB_OUTPUT    

      - name: Upload 3rd Party report to build page
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fossa-reports
          path: |
            /home/runner/work/${{ steps.set_csv_filename.outputs.csv_filename }}

