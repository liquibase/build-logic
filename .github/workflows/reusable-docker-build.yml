name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      dockerfile_path:
        description: 'Path to Dockerfile, e.g. Dockerfile, DockerfileSecure, Dockerfile.alpine'
        required: true
        type: string
      build_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      image_name:
        description: 'Base image name, e.g. liquibase/liquibase or liquibase/liquibase-secure'
        required: true
        type: string
      suffix:
        description: 'Image tag suffix, e.g. "" or -alpine'
        required: false
        type: string
        default: ''
      version:
        description: 'Full release version, e.g. 5.0.1'
        required: true
        type: string
      minor_version:
        description: 'Major.minor version, e.g. 5.0'
        required: true
        type: string
      latest_tag:
        description: 'Floating tag to push (latest or alpine)'
        required: false
        type: string
        default: 'latest'
      platforms:
        description: 'Buildx platform list'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push_dockerhub:
        description: 'Push to Docker Hub'
        required: false
        type: boolean
        default: true
      push_ghcr:
        description: 'Push to GHCR'
        required: false
        type: boolean
        default: true
      push_ecr:
        description: 'Push to Amazon ECR Public'
        required: false
        type: boolean
        default: true
      dockerhub_repo:
        description: 'Full Docker Hub repo, e.g. liquibase/liquibase'
        required: true
        type: string
      ghcr_repo:
        description: 'Full GHCR repo, e.g. ghcr.io/liquibase/liquibase'
        required: true
        type: string
      ecr_repo:
        description: 'Full ECR Public repo'
        required: true
        type: string
      dry_run:
        description: 'If true: push only to private dry-run ECR; skip DockerHub/GHCR/public ECR'
        required: false
        type: boolean
        default: false
      dry_run_ecr_repo:
        description: 'Dry-run ECR repo URL (leave empty to fall back to PRIVATE_ECR_DRY_RUN_REPO vault secret)'
        required: false
        type: string
        default: ''
      no_cache:
        description: 'Disable Docker layer cache'
        required: false
        type: boolean
        default: true
      cache_from_gha:
        description: 'Use GitHub Actions cache (set true for QA/trivy builds)'
        required: false
        type: boolean
        default: false
      build_args:
        description: 'Multi-line Docker `--build-arg` overrides (KEY=VALUE per line). Dockerfile ARG defaults apply for unset keys.'
        required: false
        type: string
        default: ''
      sign_with_cosign:
        description: 'Enable cosign keyless signing (Secure ONLY)'
        required: false
        type: boolean
        default: false
      generate_sbom:
        description: 'Attach SBOM to image (Secure ONLY)'
        required: false
        type: boolean
        default: false
      provenance_mode:
        description: 'Provenance mode: "false" or "mode=max"'
        required: false
        type: string
        default: 'false'
      cosign_identity_regexp:
        description: >-
          Regexp matching the certificate SAN identity of signatures this workflow produces. Used
          to verify every signature before reporting it successful, and the value consumers should
          pass to `cosign verify --certificate-identity-regexp`.

          Keyless signing records the workflow that PERFORMS the signing, which is this reusable
          workflow in liquibase/build-logic, NOT the calling repository. A caller that passes its
          own repo path here will not match: verified against the published 5.2.2 image, the SAN is
          https://github.com/liquibase/build-logic/.github/workflows/reusable-docker-build.yml@refs/heads/main
          The default is this workflow's own identity and is almost always what you want; the
          trailing @.* keeps it correct when a caller pins a build-logic branch.
          Pass an empty string to skip verification.
        required: false
        type: string
        default: '^https://github\.com/liquibase/build-logic/\.github/workflows/reusable-docker-build\.yml@.*'
      fail_job_on_signing_failure:
        description: >-
          When true (default), a registry left without a verifiable signature after retries fails
          this job. Set false only when the caller reads unsigned_repos and enforces it in a job of
          its own: signing failures then keep this job green so the caller's release can still
          publish, and the failure travels out via unsigned_repos instead. The default is the safe
          one on purpose, so a caller cannot silently inherit "publishes an unsigned image and stays
          green" by upgrading this workflow.
        required: false
        type: boolean
        default: true
      resign_workflow:
        description: >-
          Optional name of the caller's sign-only dispatch workflow (e.g. docker-sign.yml), used in
          the remediation message when a registry is left unsigned. Re-running a release workflow is
          never the remediation: it rebuilds and republishes a different digest, leaving registries split.
        required: false
        type: string
        default: ''
      image_source_url:
        description: 'OCI label org.opencontainers.image.source'
        required: true
        type: string
      image_description:
        description: 'OCI label org.opencontainers.image.description'
        required: true
        type: string
      image_licenses:
        description: 'OCI label: FSL-1.1-ALv2 (community) or LicenseRef-Liquibase-EULA (secure)'
        required: true
        type: string
      image_licenses_url:
        description: 'License URL (secure: https://www.liquibase.com/eula)'
        required: false
        type: string
        default: ''
      build_logic_ref:
        description: 'Ref for liquibase/build-logic checkout; override during contract-churn branches'
        required: false
        type: string
        default: 'main'
      slack_webhook_env_var:
        description: 'Vault env-var name holding the Slack webhook URL for failure alerts. Defaults to #docker-builds. Pass an empty string to disable notifications.'
        required: false
        type: string
        default: 'DOCKER_SLACK_WEBHOOK_URL'
    outputs:
      digest:
        description: 'Image digest of the pushed image (sha256:...)'
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: 'Comma-separated list of all tags pushed'
        value: ${{ jobs.build.outputs.tags }}
      unsigned_repos:
        description: 'Comma-separated repos left without a verifiable signature after retries; empty when every enabled registry was signed AND its signature verified. Only meaningful to callers that set fail_job_on_signing_failure: false, which keeps this job green so a release can still publish; those callers should enforce this output in a job nothing else depends on.'
        value: ${{ jobs.build.outputs.unsigned_repos }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
      tags: ${{ steps.generate-tags.outputs.tags }}
      unsigned_repos: ${{ steps.check-signing.outputs.unsigned_repos }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Decode DOCKERHUB_USERNAME
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          decoded_username=$(echo "$DOCKERHUB_USERNAME" | base64 -d | tr -d '\r\n')
          echo "DOCKERHUB_USERNAME_DECODED=$decoded_username" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install Cosign
        if: inputs.sign_with_cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Prepare cosign signing wrapper
        if: inputs.sign_with_cosign
        run: |
          # Registry token issuance is an external dependency that denies requests
          # transiently: ghcr.io has answered `DENIED: denied` to cosign's pull-scope
          # token request seconds after buildx pushed successfully with the same
          # login. Every `cosign sign` call below goes through this wrapper so a
          # single denial cannot decide whether a published image ends up signed.
          #
          # Scope of the retry: all attempts reuse the credential established by the
          # docker/login-action steps above and a fresh OIDC token per `cosign sign`.
          # That covers a transient denial or a rate-limited token endpoint, which is
          # the observed failure. It does NOT recover a credential that has been
          # revoked or has expired for the whole job: those fail all three attempts
          # identically and surface through unsigned_repos.
          #
          # Each attempt signs and then verifies. `cosign sign` exiting 0 is not
          # evidence that a signature is retrievable, and the 5.2.2 symptom was an
          # image with zero referrers, so verification is what makes "signed" a
          # checked fact rather than an exit code.
          #
          # The heredoc below is quoted, so the wrapper reads COSIGN_IDENTITY_REGEXP
          # from the environment when it runs, not when it is written. Each signing
          # step passes it in its own env: block alongside the repo it signs.
          cat > "${RUNNER_TEMP}/cosign-sign-retry.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          REF="$1"
          MAX_ATTEMPTS=3
          IDENTITY_REGEXP="${COSIGN_IDENTITY_REGEXP:-}"

          verify() {
            if [ -z "$IDENTITY_REGEXP" ]; then
              echo "::warning::cosign_identity_regexp is empty; skipping signature verification for ${REF}"
              return 0
            fi
            cosign verify \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REF"
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Signing ${REF} (attempt ${attempt}/${MAX_ATTEMPTS})"
            if cosign sign --yes "$REF"; then
              if verify; then
                echo "Signed and verified ${REF}"
                exit 0
              fi
              echo "::warning::cosign sign succeeded but the signature for ${REF} did not verify on attempt ${attempt}/${MAX_ATTEMPTS}"
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              delay=$((attempt * 15))
              echo "::warning::signing ${REF} failed on attempt ${attempt}/${MAX_ATTEMPTS}; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "no verifiable signature for ${REF} after ${MAX_ATTEMPTS} attempts"
          exit 1
          SCRIPT
          chmod +x "${RUNNER_TEMP}/cosign-sign-retry.sh"

      - name: Configure AWS credentials for PROD ECR
        id: configure-aws-credentials-prod
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.AWS_PROD_GITHUB_OIDC_ROLE_ARN_INFRASTRUCTURE }}
          aws-region: us-east-1
          output-credentials: true

      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run && inputs.push_dockerhub }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME_DECODED }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ !inputs.dry_run && inputs.push_ghcr }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ECR Registry (public)
        if: ${{ !inputs.dry_run && inputs.push_ecr }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        env:
          AWS_REGION: us-east-1
        with:
          registry: public.ecr.aws
          username: ${{ steps.configure-aws-credentials-prod.outputs.aws_access_key_id }}
          password: ${{ steps.configure-aws-credentials-prod.outputs.aws_secret_access_key }}

      - name: Resolve dry-run ECR repo
        if: inputs.dry_run
        id: resolve-dry-run-repo
        env:
          DRY_RUN_ECR_REPO_INPUT: ${{ inputs.dry_run_ecr_repo }}
          PRIVATE_ECR_DRY_RUN_REPO: ${{ env.PRIVATE_ECR_DRY_RUN_REPO }}
        run: |
          if [[ -n "$DRY_RUN_ECR_REPO_INPUT" ]]; then
            echo "repo=$DRY_RUN_ECR_REPO_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$PRIVATE_ECR_DRY_RUN_REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Private ECR Registry (dry-run)
        if: inputs.dry_run
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        env:
          AWS_REGION: us-east-1
        with:
          registry: ${{ steps.resolve-dry-run-repo.outputs.repo }}
          username: ${{ steps.configure-aws-credentials-prod.outputs.aws_access_key_id }}
          password: ${{ steps.configure-aws-credentials-prod.outputs.aws_secret_access_key }}

      - name: Generate Docker Tags
        id: generate-tags
        env:
          VERSION: ${{ inputs.version }}
          MINOR_VERSION: ${{ inputs.minor_version }}
          SUFFIX: ${{ inputs.suffix }}
          LATEST_TAG: ${{ inputs.latest_tag }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_REPO: ${{ steps.resolve-dry-run-repo.outputs.repo }}
          PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
          DOCKERHUB_REPO: ${{ inputs.dockerhub_repo }}
          PUSH_ECR: ${{ inputs.push_ecr }}
          ECR_REPO: ${{ inputs.ecr_repo }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          GHCR_REPO: ${{ inputs.ghcr_repo }}
        run: |
          # Preflight: fail fast when dry_run is false and no push targets are enabled
          if [[ "${IS_DRY_RUN}" != "true" ]] && \
             [[ "${PUSH_DOCKERHUB}" != "true" ]] && \
             [[ "${PUSH_ECR}" != "true" ]] && \
             [[ "${PUSH_GHCR}" != "true" ]]; then
            echo "::error::No push targets enabled and dry_run is false. Set dry_run: true for validation-only runs, or enable at least one of push_dockerhub/push_ghcr/push_ecr."
            exit 1
          fi

          TAGS=""

          if [[ "${IS_DRY_RUN}" == "true" ]]; then
            TAGS="${DRY_RUN_REPO}:${LATEST_TAG}${SUFFIX}"
            TAGS="${TAGS},${DRY_RUN_REPO}:${VERSION}${SUFFIX}"
            TAGS="${TAGS},${DRY_RUN_REPO}:${MINOR_VERSION}${SUFFIX}"
          else
            if [[ "${PUSH_DOCKERHUB}" == "true" ]]; then
              TAGS="${DOCKERHUB_REPO}:${LATEST_TAG}${SUFFIX}"
              TAGS="${TAGS},${DOCKERHUB_REPO}:${VERSION}${SUFFIX}"
              TAGS="${TAGS},${DOCKERHUB_REPO}:${MINOR_VERSION}${SUFFIX}"
            fi

            if [[ "${PUSH_ECR}" == "true" ]]; then
              if [[ -n "${TAGS}" ]]; then TAGS="${TAGS},"; fi
              TAGS="${TAGS}${ECR_REPO}:${LATEST_TAG}${SUFFIX}"
              TAGS="${TAGS},${ECR_REPO}:${VERSION}${SUFFIX}"
              TAGS="${TAGS},${ECR_REPO}:${MINOR_VERSION}${SUFFIX}"
            fi

            if [[ "${PUSH_GHCR}" == "true" ]]; then
              if [[ -n "${TAGS}" ]]; then TAGS="${TAGS},"; fi
              TAGS="${TAGS}${GHCR_REPO}:${LATEST_TAG}${SUFFIX}"
              TAGS="${TAGS},${GHCR_REPO}:${VERSION}${SUFFIX}"
              TAGS="${TAGS},${GHCR_REPO}:${MINOR_VERSION}${SUFFIX}"
            fi

            if [[ -z "${TAGS}" ]]; then
              # This branch is unreachable due to the preflight guard above,
              # but kept as a safety net to avoid an empty tag list.
              echo "::error::No registries selected (unexpected — preflight guard should have caught this)."
              exit 1
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          if [[ "${IS_DRY_RUN}" == "true" ]]; then
            echo "Generated tags (dry-run): ${TAGS}"
          else
            echo "Generated tags: ${TAGS}"
          fi

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: ${{ inputs.cache_from_gha && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache_from_gha && 'type=gha,mode=max' || '' }}
          push: true
          platforms: ${{ inputs.platforms }}
          sbom: ${{ inputs.generate_sbom }}
          provenance: ${{ inputs.provenance_mode }}
          build-args: ${{ inputs.build_args }}
          tags: ${{ steps.generate-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ inputs.image_source_url }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.licenses=${{ inputs.image_licenses }}
            ${{ inputs.image_licenses_url != '' && format('org.opencontainers.image.licenses.url={0}', inputs.image_licenses_url) || '' }}
            org.opencontainers.image.vendor=Liquibase
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.documentation=https://docs.liquibase.com
          annotations: |
            org.opencontainers.image.source=${{ inputs.image_source_url }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.licenses=${{ inputs.image_licenses }}
            ${{ inputs.image_licenses_url != '' && format('org.opencontainers.image.licenses.url={0}', inputs.image_licenses_url) || '' }}
            org.opencontainers.image.vendor=Liquibase
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.documentation=https://docs.liquibase.com

      # Cosign keyless signing — Secure images only (3 registries, each conditional)
      # `cosign sign` takes the OIDC token identity automatically; the wrapper then
      # runs `cosign verify` with cosign_identity_regexp, whose default is this
      # workflow's own SAN identity. Keyless signing records the workflow that signs
      # (this file in liquibase/build-logic), not the calling repo, so that default
      # is also the value consumers need for `cosign verify`.
      #
      # Each registry signs independently (continue-on-error) so one registry's
      # failure cannot skip the registries after it. "Check signing outcome" below
      # records what was left unsigned, annotates it as an error, and exports it via
      # unsigned_repos; whether an unsigned registry also fails this job is the
      # caller's call via fail_job_on_signing_failure (default: yes).
      - name: Sign Docker Hub Image with Cosign
        id: sign-dockerhub
        continue-on-error: true
        if: ${{ inputs.sign_with_cosign && !inputs.dry_run && inputs.push_dockerhub }}
        env:
          DOCKERHUB_REPO: ${{ inputs.dockerhub_repo }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_IDENTITY_REGEXP: ${{ inputs.cosign_identity_regexp }}
        run: |
          "${RUNNER_TEMP}/cosign-sign-retry.sh" "${DOCKERHUB_REPO}@${IMAGE_DIGEST}"

      - name: Sign GHCR Image with Cosign
        id: sign-ghcr
        continue-on-error: true
        if: ${{ inputs.sign_with_cosign && !inputs.dry_run && inputs.push_ghcr }}
        env:
          GHCR_REPO: ${{ inputs.ghcr_repo }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_IDENTITY_REGEXP: ${{ inputs.cosign_identity_regexp }}
        run: |
          "${RUNNER_TEMP}/cosign-sign-retry.sh" "${GHCR_REPO}@${IMAGE_DIGEST}"

      - name: Sign ECR Image with Cosign
        id: sign-ecr
        continue-on-error: true
        if: ${{ inputs.sign_with_cosign && !inputs.dry_run && inputs.push_ecr }}
        env:
          ECR_REPO: ${{ inputs.ecr_repo }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_IDENTITY_REGEXP: ${{ inputs.cosign_identity_regexp }}
        run: |
          "${RUNNER_TEMP}/cosign-sign-retry.sh" "${ECR_REPO}@${IMAGE_DIGEST}"

      # Dry-run signing stays fatal: nothing is published from a dry run, so a
      # signing failure there is a validation result we want to see as red.
      - name: Sign Dry-Run ECR Image with Cosign
        if: ${{ inputs.sign_with_cosign && inputs.dry_run }}
        env:
          DRY_RUN_REPO: ${{ steps.resolve-dry-run-repo.outputs.repo }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_IDENTITY_REGEXP: ${{ inputs.cosign_identity_regexp }}
        run: |
          "${RUNNER_TEMP}/cosign-sign-retry.sh" "${DRY_RUN_REPO}@${IMAGE_DIGEST}"

      - name: Check signing outcome
        id: check-signing
        if: ${{ !cancelled() && inputs.sign_with_cosign && !inputs.dry_run && steps.build-and-push.outcome == 'success' }}
        env:
          DOCKERHUB_REPO: ${{ inputs.dockerhub_repo }}
          GHCR_REPO: ${{ inputs.ghcr_repo }}
          ECR_REPO: ${{ inputs.ecr_repo }}
          DOCKERHUB_OUTCOME: ${{ steps.sign-dockerhub.outcome }}
          GHCR_OUTCOME: ${{ steps.sign-ghcr.outcome }}
          ECR_OUTCOME: ${{ steps.sign-ecr.outcome }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          FAIL_ON_SIGNING_FAILURE: ${{ inputs.fail_job_on_signing_failure }}
          RESIGN_WORKFLOW: ${{ inputs.resign_workflow }}
          LB_VERSION: ${{ inputs.version }}
        run: |
          # Records which repos lack a verifiable signature and exports them as
          # unsigned_repos. Whether that also fails this job is the caller's choice
          # (fail_job_on_signing_failure): failing here is safe by default, and a
          # caller that has built its own gate turns it off so an already-pushed
          # public image does not lose its release over a token denial.
          UNSIGNED=""
          record() {
            [ "$2" = "failure" ] || return 0
            UNSIGNED="${UNSIGNED:+${UNSIGNED},}$1"
          }
          record "$DOCKERHUB_REPO" "$DOCKERHUB_OUTCOME"
          record "$GHCR_REPO" "$GHCR_OUTCOME"
          record "$ECR_REPO" "$ECR_OUTCOME"

          echo "unsigned_repos=${UNSIGNED}" >> "$GITHUB_OUTPUT"

          {
            echo "### Cosign signing"
            echo ""
            echo "Digest: \`${IMAGE_DIGEST}\`"
            echo ""
            echo "| Repo | Result |"
            echo "| --- | --- |"
            echo "| ${DOCKERHUB_REPO} | ${DOCKERHUB_OUTCOME} |"
            echo "| ${GHCR_REPO} | ${GHCR_OUTCOME} |"
            echo "| ${ECR_REPO} | ${ECR_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$UNSIGNED" ]; then
            echo "Every enabled registry has a verifiable signature for ${IMAGE_DIGEST}."
            exit 0
          fi

          # The remediation is deliberately NOT "re-run the release". A re-run rebuilds
          # from source and pushes a new digest, so the registries that already signed
          # keep the old one and the release ends up split across registries, which is
          # exactly how liquibase/liquibase-secure 5.2.2 ended up serving 8fe090bf on
          # Docker Hub and 38317e19 on GHCR/ECR. Sign the digest that is already
          # published instead.
          if [ -n "$RESIGN_WORKFLOW" ]; then
            # Names every input the dispatch requires, so the message can be followed as-is.
            REMEDIATION="Run ${RESIGN_WORKFLOW} with version ${LB_VERSION} and digest ${IMAGE_DIGEST} to sign the published image."
          else
            REMEDIATION="Sign the published digest directly: cosign sign --yes <repo>@${IMAGE_DIGEST} for each repo listed above."
          fi
          echo "::error::Pushed but has no verifiable signature after retries: ${UNSIGNED} (digest ${IMAGE_DIGEST}). cosign verify will fail for these repos until they are signed. Do NOT re-run the release: it rebuilds and republishes a different digest, leaving registries split. ${REMEDIATION}"

          {
            echo ""
            echo "**Unsigned:** \`${UNSIGNED}\`"
            echo ""
            echo "${REMEDIATION}"
            echo ""
            echo "Do NOT re-run the release to fix this: it rebuilds and republishes a different digest, splitting the registries."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL_ON_SIGNING_FAILURE" = "true" ]; then
            exit 1
          fi
          # Caller enforces unsigned_repos itself; stay green so its release still publishes.
          exit 0

  # ============================================
  # SLACK FAILURE NOTIFICATION
  # ============================================
  # Also fires when the build itself passed but a registry was left unsigned.
  # That case keeps the build job green on purpose, so Slack is what makes it
  # visible without a human reading the run's annotations.
  notify:
    needs: [build]
    if: ${{ !cancelled() && inputs.slack_webhook_env_var != '' && (needs.build.result != 'success' || needs.build.outputs.unsigned_repos != '') }}
    # This job can now run while build is green (the unsigned case), and callers
    # gate their release publish on this workflow's overall result, so a webhook
    # or Slack API blip must not be able to fail the release either.
    continue-on-error: true
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Resolve Slack webhook
        id: webhook
        env:
          WEBHOOK_ENV_VAR: ${{ inputs.slack_webhook_env_var }}
        run: |
          # The var name is caller-controlled: validate name and value shape, and pass the
          # webhook as a step output (random-delimiter heredoc) — never into GITHUB_ENV.
          if ! printf '%s' "$WEBHOOK_ENV_VAR" | grep -qE '^[A-Z][A-Z0-9_]{0,127}$'; then
            echo "::error::Invalid slack_webhook_env_var name: $WEBHOOK_ENV_VAR"
            exit 1
          fi
          WEBHOOK_VALUE="${!WEBHOOK_ENV_VAR}"
          if [ -z "$WEBHOOK_VALUE" ]; then
            echo "::error::Slack webhook env $WEBHOOK_ENV_VAR resolved empty — check /vault/liquibase contains this key"
            exit 1
          fi
          if ! printf '%s' "$WEBHOOK_VALUE" | grep -qE '^https://hooks\.slack\.com/[A-Za-z0-9/_+-]+$'; then
            echo "::error::$WEBHOOK_ENV_VAR does not look like a Slack webhook URL"
            exit 1
          fi
          DELIM="WEBHOOK_EOF_${RANDOM}${RANDOM}"
          {
            echo "url<<$DELIM"
            echo "$WEBHOOK_VALUE"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ steps.webhook.outputs.url }}
          # An unsigned public image is a failure, not a warning: it is published,
          # pullable, and cosign verify does not pass on it. Colouring it 'warning'
          # under-calls the severity for whoever reads the channel.
          SLACK_COLOR: failure
          SLACK_TITLE: "${{ needs.build.result != 'success' && format('❌ {0} ❌ Docker build failed on {1} ({2})', github.repository, github.ref_name, github.sha) || format('❌ {0} ❌ Docker image pushed but NOT SIGNED on {1}', github.repository, github.ref_name) }}"
          SLACK_MESSAGE: "${{ needs.build.result != 'success' && format('View run: {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || format('cosign signing failed after retries for: {0}. These images are public and unverifiable until re-signed. View run: {1}/{2}/actions/runs/{3}', needs.build.outputs.unsigned_repos, github.server_url, github.repository, github.run_id) }}"
          SLACK_USERNAME: liquibot
          SLACK_ICON_EMOJI: ":whale:"
          SLACK_FOOTER: "${{ github.repository }}"
          SLACK_LINK_NAMES: true
