# TEMPORARY (TECHOPS-1015): proves Docker Hub OIDC login from a reusable workflow. Delete after rollout.
name: TEMP Test Docker OIDC login

on:
  workflow_call:
    inputs:
      test_repo:
        description: "Docker Hub repo for the test push, e.g. <org>/oidc-test (scratch repo, not a real image)"
        type: string
        default: ""
      push_test_image:
        description: "Push busybox to test_repo to prove write access"
        type: boolean
        default: false
      sleep_seconds:
        description: "Wait between login and push to measure how long the token lives"
        type: number
        default: 0
      expire_seconds:
        description: "OIDC access token lifetime in seconds (login-action v4.6.0: default 300, allowed 300-3600; production uses 3600)"
        type: number
        default: 3600
      try_description_update:
        description: "PATCH test_repo's short description with the OIDC token (does the Hub API accept it?)"
        type: boolean
        default: false
      try_scout:
        description: "Run a Docker Scout scan with the OIDC login (production scans use Scout)"
        type: boolean
        default: false
    secrets:
      LIQUIBASE_VAULT_OIDC_ROLE_ARN:
        required: true

permissions: {}

jobs:
  docker-oidc-login:
    name: Docker Hub OIDC login
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Runs before any Docker setting is needed, so it works with no connection yet.
      # This is the TEST's sub. Production differs: reusable-docker-build/scan/sign.yml@refs/heads/main
      # (liquibase, liquibase-pro) and release-published.yml on v* tags (mcp server), so do not
      # copy this output into the production ruleset.
      - name: Show OIDC token claims
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=docker-oidc-test" | jq -r .value)
          echo "::add-mask::${token}"
          jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson
            | {sub, job_workflow_ref, ref, repository, event_name, environment}' <<<"${token}"

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      # Answers whether an org variable is visible inside a reusable workflow (the real workflows rely on it).
      - name: Check the connection id variable resolves in this context
        env:
          CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        run: |
          [ -n "${CONNECTION_ID}" ] || { echo "::error::vars.DOCKERHUB_OIDC_CONNECTIONID is empty (not set in the org, or not visible here)"; exit 1; }
          echo "connection id set (${#CONNECTION_ID} chars)"

      - name: Decode DOCKERHUB_USERNAME
        id: decode
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          decoded_username=$(echo "$DOCKERHUB_USERNAME" | base64 -d | tr -d '\r\n')
          [ -n "$decoded_username" ] || { echo "::error::DOCKERHUB_USERNAME decoded to empty"; exit 1; }
          echo "username=$decoded_username" >> "$GITHUB_OUTPUT"
          echo "Docker org: $decoded_username"

      - name: Login to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.expire_seconds }}
        with:
          username: ${{ steps.decode.outputs.username }}

      - name: Wait before using the token
        if: ${{ inputs.sleep_seconds > 0 }}
        env:
          SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: sleep "${SLEEP_SECONDS}"

      - name: Push test image
        if: ${{ inputs.push_test_image && inputs.test_repo != '' }}
        env:
          TEST_REPO: ${{ inputs.test_repo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="${TEST_REPO}:oidc-test-${RUN_ID}"
          docker pull busybox:1.37
          docker tag busybox:1.37 "${tag}"
          docker push "${tag}"
          echo "Pushed ${tag}"

      # Settles whether README sync can use OIDC: does the Hub management API accept the
      # login-action access token? Only touches test_repo, and only when asked.
      - name: Try a description update with the OIDC token
        if: ${{ inputs.try_description_update && inputs.test_repo != '' }}
        env:
          TEST_REPO: ${{ inputs.test_repo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          auth=$(jq -r '[.auths | to_entries[] | select(.key | test("docker\\.io")) | .value.auth][0] // empty' ~/.docker/config.json)
          [ -n "${auth}" ] || { echo "::error::no inline Docker Hub credential in ~/.docker/config.json"; exit 1; }
          token=$(printf '%s' "${auth}" | base64 -d | cut -d: -f2-)
          echo "::add-mask::${token}"
          body=$(jq -n --arg d "OIDC description test ${RUN_ID}" '{description: $d}')
          ok=0
          for scheme in Bearer JWT; do
            code=$(curl -sS -o "${RUNNER_TEMP}/resp.json" -w '%{http_code}' -X PATCH \
              "https://hub.docker.com/v2/repositories/${TEST_REPO}/" \
              -H "Authorization: ${scheme} ${token}" -H 'Content-Type: application/json' -d "${body}")
            echo "${scheme}: HTTP ${code}"; head -c 300 "${RUNNER_TEMP}/resp.json"; echo
            if [ "${code}" = "200" ]; then ok=1; break; fi
          done
          [ "${ok}" = "1" ]

      # reusable-docker-scan.yml used a user PAT for Scout; this checks Scout accepts the OIDC token.
      - name: Install Docker Scout CLI (pinned like the scan workflow)
        if: ${{ inputs.try_scout }}
        env:
          SCOUT_VERSION: v1.23.1
        run: curl -sSfL "https://raw.githubusercontent.com/docker/scout-cli/${SCOUT_VERSION}/install.sh" | sh -s -- "${SCOUT_VERSION}"

      - name: Scan a public image with Docker Scout
        if: ${{ inputs.try_scout }}
        run: |
          set -euo pipefail
          docker scout version
          docker scout cves --only-severity critical docker.io/library/busybox:1.37
