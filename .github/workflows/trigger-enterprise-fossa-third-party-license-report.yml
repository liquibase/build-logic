name: Trigger Enterprise-FOSSA 3rd Party License Report

on:
  workflow_dispatch:
    inputs:
      version_number_for_3p_fossa_report_generation:
        type: string
        description: 'Supply the DaticalDb-installer version number to be stored in the R2 bucket. eg 8.7.352'
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  wait-for-fossa-report-generation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [
          { name: "DaticalDB-installer", ref: "main",owner: "Datical" },
          {name: "ephemeral-database", ref: "main",owner: "liquibase"},
          { name: "drivers", ref: "main",owner: "Datical" },
          {name: "protoclub", ref: "develop",owner: "Datical"},
          { name: "datical-sqlparser", ref: "main",owner: "Datical" },
          { name: "storedlogic", ref: "main",owner: "Datical" },
          { name: "AppDBA", ref: "main",owner: "Datical" },
          { name: "liquibase-bundle", ref: "main",owner: "Datical" },
          { name: "liquibase", ref: "ddb",owner: "Datical" }
        ]

    name: "${{ matrix.repo.name }} - Fossa Report"
    env:
      VERSION_INPUT: ${{ github.event.inputs.version_number_for_3p_fossa_report_generation }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true
      - name: Set workflow inputs
        env:
          REPO_NAME: ${{ matrix.repo.name }}
        run: |
          if [[ "$REPO_NAME" ]]; then
            echo "WORKFLOW_INPUTS={ \"version_number_for_3p_fossa_report_generation\": \"$VERSION_INPUT\" }" >> $GITHUB_ENV
          else
            echo "WORKFLOW_INPUTS={}" >> $GITHUB_ENV
          fi

      - name: Dispatch an action and get the run ID
        uses: codex-/return-dispatch@16fa9d14771c4d56ae0196bbda1d3c17f7f3650f # v3
        id: return_dispatch
        continue-on-error: true
        with:
          token: ${{ env.FOSSA_TRIGGER_REPORT_GENERATION }}
          ref: ${{ matrix.repo.ref }}
          repo: ${{ matrix.repo.name }}
          owner: ${{ matrix.repo.owner }}
          workflow: fossa.yml
          workflow_inputs: ${{ env.WORKFLOW_INPUTS }}

      - name: Retry fetching run ID (max 4 attempts with 5 seconds delay)
        env:
          DISPATCH_RUN_ID: ${{ steps.return_dispatch.outputs.run_id }}
        run: |
          retries=7
          delay=5  # Delay of 5 seconds between retries
          for i in $(seq 1 $retries); do
            run_id="$DISPATCH_RUN_ID"
            if [ -n "$run_id" ]; then
              echo "Found run ID: $run_id"
              echo "run_id=$run_id" >> $GITHUB_ENV
              break
            else
              echo "Run ID not found, retrying in $delay seconds..."
            fi

            if [ $i -eq $retries ]; then
              echo "Failed to get run ID after $retries attempts."
              exit 1
            fi

            # Wait before retrying
            sleep $delay
          done
        shell: bash

      - name: Await Run ID ${{ steps.return_dispatch.outputs.run_id }}
        uses: Codex-/await-remote-run@1fd400f3e2033480390bd521e6626b24365c9c20 # v1
        with:
          token: ${{ env.FOSSA_TRIGGER_REPORT_GENERATION }}
          run_id: ${{ steps.return_dispatch.outputs.run_id }}
          repo: ${{ matrix.repo.name }}
          owner: ${{ matrix.repo.owner }}
          run_timeout_seconds: 1200 # 20 minutes Time until giving up on the run
          poll_interval_ms: 120000 # 2 minutes Frequency to poll the run for a status.


  combine-3p-fossa-reports:
    runs-on: ubuntu-latest
    needs: wait-for-fossa-report-generation
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: liquibase/build-logic
          ref: main
          path: build-logic

      - name: Configure AWS credentials for devops vault access
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.DEVOPS_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load Cloudflare R2 credentials from devops vault
        # Pulls only the keys this job needs from /vault/devops and masks them
        # (least privilege), rather than bulk-importing the vault.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/devops --region us-east-1 --query SecretString --output text)
          for k in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do
            v=$(printf '%s' "$JSON" | jq -r --arg k "$k" '.[$k] // ""')
            if [ -z "$v" ] || [ "$v" = "null" ]; then echo "::error::$k missing from /vault/devops"; exit 1; fi
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done
          echo "Loaded CLOUDFLARE_ACCOUNT_ID and R2 access/secret keys from /vault/devops."

      - name: Download reports from R2 and Rearrange CSV files
        env:
          R2_AKID: ${{ env.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ env.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # R2 rejects a request carrying a session token; OIDC creds export one, so
          # drop it (and its legacy alias) before every R2 S3-API call.
          unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN

          # Create a directory to store downloaded reports from R2
          mkdir -p /home/runner/work/enterprise/fossa_reports_s3

          # Download all files from the specified R2 bucket to the created directory
          AWS_ACCESS_KEY_ID="$R2_AKID" AWS_SECRET_ACCESS_KEY="$R2_SECRET" \
            aws s3 cp --recursive "s3://liquibase-org-assets/enterprise_fossa_report/${VERSION_INPUT}/raw_reports" /home/runner/work/enterprise/fossa_reports_s3/ --endpoint-url "$R2_ENDPOINT"

          # List the contents of the directory to confirm successful download
          ls -l /home/runner/work/enterprise/fossa_reports_s3

          # Define an array of CSV file names. We dont have ephemeral-database here as it is not part of enterprise
          csv_files=("DaticalDB-installer" "drivers" "protoclub" "datical-sqlparser" "storedlogic" "AppDBA" "liquibase-bundle" "liquibase")

          # Loop through each CSV file and remove headers again for combine report generation
          for file in "${csv_files[@]}"; do
            tail -n +1 /home/runner/work/enterprise/fossa_reports_s3/${file}.csv >> /home/runner/work/enterprise/fossa_reports_s3/${file}_no_header.csv
          done

          # Concatenate all CSV files without headers, sort, and remove duplicates
          cat /home/runner/work/enterprise/fossa_reports_s3/*_no_header.csv | sort | uniq > /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv

          # Add a header to the final CSV file, placing it above the sorted and unique data and remove the last line of headers
          echo 'Title,Version,Declared License,Package Homepage' | cat - /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv > temp && mv temp /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv && sed -i '$ d' /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv

          ls -l $GITHUB_WORKSPACE

          # Read ignored dependencies from a file
          ignoredLibsFile=$(cat $GITHUB_WORKSPACE/build-logic/.github/workflows/ignore_dependencies_fossa.txt)

          # Split the ignored dependencies into an array
          IFS=',' read -r -a ignoredLibs <<< "$ignoredLibsFile"

          # Create a temporary file
          tempfile=$(mktemp)

          # Build the grep command to filter out ignored dependencies
          grepCmd="grep -iv"
          for lib in "${ignoredLibs[@]}"; do
            grepCmd="$grepCmd -e \"$lib\""
          done

          # Process the FOSSA report to remove ignored dependencies
          cat /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv | eval $grepCmd > enterprise_report.csv


      - name: Upload CSV to Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: enterprise_report
          path: ./enterprise_report.csv

      - name: Upload merged CSV to R2
        if: always()
        env:
          VERSION_NUMBER: ${{ inputs.version_number_for_3p_fossa_report_generation }}
          R2_AKID: ${{ env.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ env.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # R2 rejects a request carrying a session token; OIDC creds export one, so
          # drop it (and its legacy alias) before every R2 S3-API call.
          unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          # CRC32: newer aws-cli defaults to a CRC64NVME checksum, which R2 rejects.
          AWS_ACCESS_KEY_ID="$R2_AKID" AWS_SECRET_ACCESS_KEY="$R2_SECRET" \
            aws s3 cp enterprise_report.csv "s3://liquibase-org-assets/enterprise_fossa_report/${VERSION_NUMBER}/enterprise_report_${VERSION_NUMBER}.csv" --checksum-algorithm CRC32 --endpoint-url "$R2_ENDPOINT"


  trigger-datical-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Dispatch an action for datical-service
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ env.FOSSA_TRIGGER_REPORT_GENERATION }}
          repository: Datical/datical-service
          event-type: trigger-fossa-report-generation
          client-payload: '{"ref": "main", "version_number_for_3p_fossa_report_generation": "${{ github.event.inputs.version_number_for_3p_fossa_report_generation }}"}'
          
