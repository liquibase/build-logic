# Smoke test for the FIPS VM: docker compose starts PostgreSQL.
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: fips-vm-selftest-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
